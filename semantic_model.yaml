# Semantic model — certified metric definitions for the Semantic Execution Gateway.
#
# This file is a SOURCE OF TRUTH, not documentation. src/semantic/model.py validates
# every entity, column and join path in here against live BigQuery introspection at
# load time and refuses to load on a mismatch. A metric that is not defined here
# cannot be compiled, which is the property the whole gateway exists to provide.
#
# Every formula below was lifted from the ground-truth SQL already committed in
# evals/cases.json. Nothing here is invented business logic -- if a definition looks
# arbitrary (catalog margin rather than realised margin, 'Returned' status rather
# than returned_at), it is arbitrary in the eval set too, and this file is only
# making the existing choice explicit and reviewable.
#
# CONVENTIONS
#   source: <entity>.<column>   -- split on the FIRST dot only, so GA's nested
#                                  paths survive intact:
#                                    users.region            -> users / region
#                                    ga_sessions.totals.hits -> ga_sessions / totals.hits
#   formula                     -- one aggregate SQL expression over the base entity.
#                                  Measures needing a grouped subquery are NOT
#                                  expressible here by design; see `unsupported` below.
#
# SCOPE DECISIONS (explicit, not omissions)
#   * Both thelook_ecommerce and google_analytics_sample are modelled, because
#     Layer 1's Definition of Done is "every question in the existing eval set".
#   * ga_sessions is a wildcard over 366 date shards. `partition.required: true`
#     makes a _TABLE_SUFFIX bound mandatory at compile time -- the compiler cannot
#     emit an unbounded GA scan, which is what keeps it under the 1 GB cost ceiling
#     without relying on the dry-run check to catch it after the fact.
#   * Two eval questions (tl02 average order value, tl17 repeat-purchase rate)
#     aggregate over a grouped subquery. They are deliberately absent from this
#     model and route to the legacy LLM path via Intent.unsupported. They are the
#     honest denominator in the coverage number, not a gap to paper over.

version: "0.1.0"
dialect: bigquery

entities:
  - name: order_items
    table: bigquery-public-data.thelook_ecommerce.order_items
    primary_key: id
    description: One row per item within an order. Revenue grain.

  - name: orders
    table: bigquery-public-data.thelook_ecommerce.orders
    primary_key: order_id
    description: One row per order. Fulfilment and status grain.

  - name: users
    table: bigquery-public-data.thelook_ecommerce.users
    primary_key: id
    description: One row per customer.

  - name: products
    table: bigquery-public-data.thelook_ecommerce.products
    primary_key: id
    description: Product catalogue. Cost and retail price are list values.

  - name: events
    table: bigquery-public-data.thelook_ecommerce.events
    primary_key: id
    description: Clickstream events.

  - name: ga_sessions
    table: bigquery-public-data.google_analytics_sample.ga_sessions_*
    primary_key: visitId
    description: One row per GA session. Wildcard over daily shards.
    partition:
      column: _TABLE_SUFFIX
      format: "%Y%m%d"
      required: true
      reason: >
        366 shards x 338 columns. An unbounded scan is 5.77 GB against a 1 GB
        ceiling, so a date bound is a compile-time requirement, not a runtime check.

joins:
  - name: order_items_to_orders
    relationship: many_to_one
    path: "order_items.order_id = orders.order_id"

  - name: order_items_to_products
    relationship: many_to_one
    path: "order_items.product_id = products.id"

  - name: orders_to_users
    relationship: many_to_one
    path: "orders.user_id = users.id"

  - name: order_items_to_users
    relationship: many_to_one
    path: "order_items.user_id = users.id"

  - name: events_to_users
    relationship: many_to_one
    path: "events.user_id = users.id"

measures:
  # -- thelook: revenue and margin -----------------------------------------
  - name: total_revenue
    description: Gross merchandise value across order items.
    base_entity: order_items
    formula: "ROUND(SUM(sale_price), 2)"
    eval_source: tl01, tl14

  - name: avg_profit_margin_pct
    description: >
      Mean catalogue margin as a percentage of retail price. Catalogue margin,
      not realised margin -- it reads products.cost/retail_price and ignores the
      discount actually applied at sale. Matches the committed ground truth.
    base_entity: products
    formula: "ROUND(AVG((retail_price - cost) / NULLIF(retail_price, 0)) * 100, 2)"
    eval_source: tl06

  - name: max_retail_price
    description: Highest list price, for ranking products.
    base_entity: products
    formula: "ROUND(MAX(retail_price), 2)"
    eval_source: tl16

  # -- thelook: counts -----------------------------------------------------
  - name: order_count
    description: Number of orders.
    base_entity: orders
    formula: "COUNT(*)"
    eval_source: tl11, tl13

  - name: user_count
    description: Number of customers.
    base_entity: users
    formula: "COUNT(*)"
    eval_source: tl04, tl05, tl08, tl15

  - name: event_count
    description: Number of clickstream events.
    base_entity: events
    formula: "COUNT(*)"
    eval_source: tl07

  - name: product_count
    description: Number of catalogue items.
    base_entity: products
    formula: "COUNT(*)"
    eval_source: tl12

  # -- thelook: rates and averages -----------------------------------------
  - name: returned_order_pct
    description: >
      Percentage of orders in 'Returned' status. Uses orders.status rather than
      returned_at -- the two disagree slightly in this dataset; status is what the
      committed ground truth uses.
    base_entity: orders
    formula: "ROUND(100 * COUNTIF(status = 'Returned') / COUNT(*), 2)"
    eval_source: tl03

  - name: avg_customer_age
    description: Mean customer age in years.
    base_entity: users
    formula: "ROUND(AVG(age), 2)"
    eval_source: tl09

  - name: avg_days_to_ship
    description: >
      Mean elapsed time from order creation to shipment, in days. Computed in
      hours then divided by 24 so partial days are not truncated.
    base_entity: orders
    formula: "ROUND(AVG(TIMESTAMP_DIFF(shipped_at, created_at, HOUR)) / 24, 2)"
    filters: ["shipped_at IS NOT NULL"]
    eval_source: tl10

  # -- GA ------------------------------------------------------------------
  - name: session_count
    description: Number of GA sessions.
    base_entity: ga_sessions
    formula: "COUNT(*)"
    eval_source: ga01, ga04, ga06

  - name: avg_pageviews_per_session
    base_entity: ga_sessions
    formula: "ROUND(AVG(totals.pageviews), 2)"
    eval_source: ga02

  - name: conversion_rate_pct
    description: Percentage of sessions containing at least one transaction.
    base_entity: ga_sessions
    formula: "ROUND(100 * COUNTIF(totals.transactions IS NOT NULL) / COUNT(*), 3)"
    eval_source: ga03

  - name: bounce_rate_pct
    base_entity: ga_sessions
    formula: "ROUND(100 * COUNTIF(totals.bounces IS NOT NULL) / COUNT(*), 2)"
    eval_source: ga05

  - name: total_transaction_revenue_usd
    description: >
      GA stores revenue in micros; divided by 1e6 to yield USD. Uses
      totalTransactionRevenue, matching the committed ground truth.
    base_entity: ga_sessions
    formula: "ROUND(SUM(totals.totalTransactionRevenue) / 1e6, 2)"
    eval_source: ga07

  - name: avg_session_duration_seconds
    base_entity: ga_sessions
    formula: "ROUND(AVG(totals.timeOnSite), 2)"
    filters: ["totals.timeOnSite IS NOT NULL"]
    eval_source: ga08

dimensions:
  # -- thelook -------------------------------------------------------------
  - name: product_category
    type: string
    source: products.category
    eval_source: tl01, tl06

  - name: product_brand
    type: string
    source: products.brand
    eval_source: tl12

  - name: product_name
    type: string
    source: products.name
    eval_source: tl16

  - name: order_status
    type: string
    source: orders.status
    eval_source: tl11

  - name: user_traffic_source
    type: string
    source: users.traffic_source
    eval_source: tl04, tl15

  - name: user_country
    type: string
    source: users.country
    eval_source: tl08

  - name: user_state
    type: string
    source: users.state
    eval_source: tl13

  - name: user_gender
    type: string
    source: users.gender
    eval_source: tl09

  - name: user_signup_month
    type: date_month
    source: users.created_at
    expression: "FORMAT_TIMESTAMP('%Y-%m', created_at)"
    description: Signup timestamp truncated to month, rendered YYYY-MM.
    eval_source: tl05

  - name: event_type
    type: string
    source: events.event_type
    eval_source: tl07

  # -- GA ------------------------------------------------------------------
  - name: ga_traffic_source
    type: string
    source: ga_sessions.trafficSource.source
    eval_source: ga01

  - name: ga_traffic_medium
    type: string
    source: ga_sessions.trafficSource.medium
    eval_source: ga05

  - name: ga_device_category
    type: string
    source: ga_sessions.device.deviceCategory
    eval_source: ga04

  - name: ga_country
    type: string
    source: ga_sessions.geoNetwork.country
    eval_source: ga06

# Row-level security policies consumed by Layer 2 (src/compiler/security.py).
# The identity these key off is SIMULATED -- there are no real tenants in a public
# BigQuery dataset. Declared here so the policy is reviewable next to the model it
# governs rather than buried in application code.
row_policies:
  - entity: users
    principal_field: region
    column: country
    description: A principal may only read users whose country is in their allowed set.

  - entity: ga_sessions
    principal_field: region
    column: geoNetwork.country
    description: A principal may only read sessions from their allowed countries.
